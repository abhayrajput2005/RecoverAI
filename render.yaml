# Render.com blueprint for the RecoverAI backend.
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint",
# point it at the repo. Render will read this file automatically.
#
# After deploy, set the real secrets (GEMINI_API_KEY, RAZORPAY_KEY_ID,
# RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET) in the Render dashboard —
# never commit them here.

services:
  - type: web
    name: recoverai-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./recoverai.db
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
