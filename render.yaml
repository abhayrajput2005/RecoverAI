# RecoverAI - Render deployment
# FastAPI backend for the RecoverAI payment recovery agent.
#
# IMPORTANT:
# Never put real API keys/secrets in this file.
# Add secret values in the Render Dashboard.

services:
  - type: web
    name: recoverai-backend
    runtime: python
    plan: free
    region: singapore

    # RecoverAI backend is inside the backend/ directory.
    rootDir: backend

    # Install Python dependencies.
    buildCommand: pip install -r requirements.txt

    # Start FastAPI with Uvicorn on Render's assigned port.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Render uses this endpoint to verify that the API is healthy.
    healthCheckPath: /health

    # Automatically deploy new commits pushed to master.
    autoDeploy: true

    envVars:
      # SQLite database for the Buildathon demo.
      # NOTE: Render Free services do not provide persistent local storage.
      - key: DATABASE_URL
        value: sqlite:///./recoverai.db

      # Python version compatible with the locally tested environment.
      - key: PYTHON_VERSION
        value: 3.10.0

      # Gemini configuration.
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: GEMINI_API_KEY
        sync: false

      # Razorpay TEST MODE credentials.
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      # Razorpay webhook signing secret.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
